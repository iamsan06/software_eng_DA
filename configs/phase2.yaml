# Phase 2 & 3 Configuration: 16-Week Rainfall Lag & Deep Sequence Modeling
project_name: "Rainfall-Lag-Aware Crop Yield Forecasting in India Using Explainable Temporal Machine Learning"
phase: 2
seed: 42

paths:
  clean_data: "data/processed/phase1_clean.csv"
  weekly_rainfall: "data/interim/district_weekly_rainfall.parquet"
  lag_features: "data/processed/phase2_lag_features.parquet"
  models_dir: "results/models"
  tables_dir: "results/tables"
  figures_dir: "results/figures"
  predictions_dir: "results/predictions"

crop_calendar:
  lag_window_size: 16
  default_harvest_week: 44
  seasons:
    - "Kharif"

features:
  target: "RICE.YIELD..Kg.per.ha."
  lag_columns:
    - "Rain_Lag_16"
    - "Rain_Lag_15"
    - "Rain_Lag_14"
    - "Rain_Lag_13"
    - "Rain_Lag_12"
    - "Rain_Lag_11"
    - "Rain_Lag_10"
    - "Rain_Lag_9"
    - "Rain_Lag_8"
    - "Rain_Lag_7"
    - "Rain_Lag_6"
    - "Rain_Lag_5"
    - "Rain_Lag_4"
    - "Rain_Lag_3"
    - "Rain_Lag_2"
    - "Rain_Lag_1"
  secondary_numerical:
    - "IMD_Tmax"
  spatial_categorical:
    - "State_Clean"

split:
  train_years: [1990, 2009]
  val_years: [2010, 2013]
  test_years: [2014, 2017]

tabular_models:
  random_forest:
    n_estimators: 200
    max_depth: 16
    min_samples_split: 5
    min_samples_leaf: 2
    max_features: "sqrt"
    random_state: 42
    n_jobs: -1
  xgboost:
    n_estimators: 250
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    random_state: 42
    n_jobs: -1

sequence_models:
  batch_size: 64
  max_epochs: 50
  patience: 10
  lstm:
    seq_input_dim: 1
    static_input_dim: 20
    hidden_dim: 64
    num_layers: 2
    dropout: 0.2
    bidirectional: false
    lr: 0.001
    weight_decay: 0.0001
  gru:
    seq_input_dim: 1
    static_input_dim: 20
    hidden_dim: 64
    num_layers: 2
    dropout: 0.2
    lr: 0.001
    weight_decay: 0.0001
