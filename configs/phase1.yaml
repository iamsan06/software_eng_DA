# Phase 1 Configuration: India-wide Baseline Crop Yield Forecasting
project_name: "Rainfall-Lag-Aware Crop Yield Forecasting in India Using Explainable Temporal Machine Learning"
phase: 1
seed: 42

paths:
  raw_data: "data/raw/Data(1).csv"
  raw_data_fallback: "data/raw/Data.csv"
  processed_data: "data/processed/phase1_clean.csv"
  tables_dir: "results/tables"
  figures_dir: "results/figures"
  predictions_dir: "results/predictions"
  models_dir: "results/models"
  reports_dir: "results/reports"

encoding: "latin1"

columns:
  target: "RICE.YIELD..Kg.per.ha."
  raw_target: "RICE.YIELD..Kg.per.ha."
  identifiers:
    - "Dist.Code"
    - "Sh_Dist_code"
    - "FID_1"
    - "State"
    - "District"
    - "Year"
    - "stable_geographic_id"
  descriptive_excluded:
    - "RICE.AREA..1000.ha."
    - "RICE.PRODUCTION..1000.tons."
    - "RICE.SHARE.IN.TOTAL..Percent."
    - "Crops"
    - "AgroClimate"
  meteorological_features:
    - "IMD_RF"
    - "IMD_Tmax"
    - "SD_RF_jun_nov"
  categorical_features:
    - "State"

split:
  method: "chronological"
  train_years: [1990, 2009]
  val_years: [2010, 2013]
  test_years: [2014, 2017]
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

models:
  random_forest:
    n_estimators: 200
    max_depth: 15
    min_samples_split: 5
    min_samples_leaf: 2
    max_features: "sqrt"
    random_state: 42
    n_jobs: -1
  xgboost:
    n_estimators: 250
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    random_state: 42
    n_jobs: -1
